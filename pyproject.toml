[project]
name = "urbanwatt-sql"
version = "0.1.0"
description = "urbanwatt api pour database"
readme = "README.md"
authors = [
    { name = "Hitomi" },
    { name = "Ezechiel"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
urbanwatt-sql = "urbanwatt_sql:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
